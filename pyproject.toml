[project]
name = "biomcp-bench"
version = "0.1.0"
description = "An MCP server over public protein-structure and bioactivity data, with a benchmark measuring how tool design affects agent success and token cost."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.12.3",
]

[project.optional-dependencies]
evals = [
    "anthropic==0.80.0",
    "pyyaml==6.0.2",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "respx==0.22.0",
]

[project.scripts]
biomcp = "biomcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
