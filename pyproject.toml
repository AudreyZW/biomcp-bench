[project]
name = "biomcp-bench"
version = "0.1.0"
description = "An MCP server over public protein-structure and bioactivity data, with a benchmark measuring how tool design affects agent success and token cost."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.12.3",
]

[project.optional-dependencies]
evals = [
    "anthropic==0.80.0",
    "pyyaml==6.0.2",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "respx==0.22.0",
    "ruff==0.14.2",
    "mypy==1.18.2",
    "types-pyyaml==6.0.12.20250915",
]

[project.scripts]
biomcp = "biomcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/biomcp/py.typed" = "biomcp/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# The shipped package only. The benchmark's entry-point scripts are measured by
# running them -- the replay benchmark is a CI step -- and folding them in here
# would drag the number down to 65% while saying nothing about the library.
source = ["src/biomcp"]

[tool.coverage.report]
# A floor, not a target, and it exists for a specific reason: `get_structure`
# shipped broken while the suite was green, because nothing called it and
# nothing said so. Set just under what the suite actually reaches (87%), so a
# real regression trips it and ordinary churn does not.
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
files = ["src/biomcp", "evals", "scripts"]
# The package ships py.typed, so its own annotations are checked strictly.
# The benchmark is scripts around it and is held to a lower bar: it imports
# by sys.path and talks to loosely typed JSON, where demanding full
# annotations would buy noise rather than safety.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["harness", "variants", "run", "stats", "power", "ollama_driver", "live"]
ignore_errors = true

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "evals", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async pitfalls
]
ignore = [
    "B008",    # Depends-style defaults are how MCP tool schemas are declared
    "SIM105",  # contextlib.suppress is less readable than a narrow except here
]

[tool.ruff.lint.per-file-ignores]
# Benchmark entry points insert sys.path before importing local modules.
"evals/run.py" = ["E402"]
"scripts/refresh_cache.py" = ["E402"]
"tests/test_shaping.py" = ["E402"]
