      - {tool: find_similar_compounds, args: {smiles: "CC(=O)Oc1ccccc1C(=O)O", threshold: 70, limit: 3}}
    granular:
      - {tool: chembl_similarity_search, args: {smiles: "CC(=O)Oc1ccccc1C(=O)O", threshold: 70, limit: 3}}

