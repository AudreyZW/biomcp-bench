# Benchmark tasks: realistic structural-biology and medicinal-chemistry
# questions with answers that can be checked programmatically.
#
# Each task carries an oracle path per tool family -- the minimal correct call
# sequence. `$find:a|b` pulls a value from an earlier response, naming every
# alias it goes by: shaped responses say `uniprot`, raw upstream ones say
# `primaryAccession`. Needing both names is the cost of raw responses, visible.
#
# `expect` pins facts that do not drift. `pattern` checks the shape of answers
# that do, because ChEMBL grows and the most potent known compound changes.

- id: egfr_accession
  question: What is the UniProt accession for human EGFR?
  grade: {keys: [uniprot, primaryAccession], expect: P00533}
  oracle:
    task_shaped:
      - {tool: find_target, args: {query: EGFR, limit: 1}}
    granular:
      - {tool: uniprot_search, args: {query: "EGFR AND organism_id:9606 AND reviewed:true", size: 1}}

- id: egfr_chembl_target
  question: Which ChEMBL target corresponds to human EGFR?
  grade: {keys: [chembl_target, target_chembl_id], expect: CHEMBL203}
  oracle:
    task_shaped:
      - {tool: find_target, args: {query: EGFR, limit: 1}}
    granular:
      - {tool: uniprot_search, args: {query: "EGFR AND organism_id:9606 AND reviewed:true", size: 1}}
      - {tool: chembl_filter_targets_by_accession, args: {accession: "$find:primaryAccession", limit: 1}}

- id: egfr_most_potent
  question: What is the ChEMBL ID of the most potent known EGFR inhibitor by pChEMBL value?
  grade: {keys: [compound, molecule_chembl_id], pattern: "CHEMBL[0-9]+"}
  oracle:
    task_shaped:
      - {tool: find_target, args: {query: EGFR, limit: 1}}
      - {tool: find_ligands, args: {target: "$find:uniprot|primaryAccession", limit: 1}}
    granular:
      - {tool: uniprot_search, args: {query: "EGFR AND organism_id:9606 AND reviewed:true", size: 1}}
      - {tool: chembl_filter_targets_by_accession, args: {accession: "$find:primaryAccession", limit: 1}}
      - {tool: chembl_filter_activities, args: {target_chembl_id: "$find:target_chembl_id", order_by: "-pchembl_value", limit: 1}}

- id: egfr_best_structure
  question: What is the PDB ID of the best-resolved EGFR structure with a bound ligand?
  grade: {keys: [pdb_id, rcsb_id, identifier], pattern: "[0-9A-Za-z]{4}"}
  oracle:
    task_shaped:
      - {tool: get_structures, args: {uniprot_accession: P00533, require_ligand: true, limit: 1}}
    granular:
      - {tool: pdb_search_combined, args: {attribute_a: "rcsb_polymer_entity_container_identifiers.reference_sequence_identifiers.database_accession", operator_a: exact_match, value_a: P00533, attribute_b: "rcsb_entry_info.nonpolymer_entity_count", operator_b: greater, value_b: 0, rows: 1}}

- id: egfr_liganded_count
  question: How many EGFR structures in the PDB have a bound small molecule?
  grade: {keys: [total_matches, total_count], pattern: "[0-9]+"}
  oracle:
    task_shaped:
      - {tool: get_structures, args: {uniprot_accession: P00533, require_ligand: true, limit: 1}}
    granular:
      - {tool: pdb_search_combined, args: {attribute_a: "rcsb_polymer_entity_container_identifiers.reference_sequence_identifiers.database_accession", operator_a: exact_match, value_a: P00533, attribute_b: "rcsb_entry_info.nonpolymer_entity_count", operator_b: greater, value_b: 0, rows: 1}}

- id: mpro_6lu7_resolution
  question: What is the resolution of PDB entry 6LU7?
  grade: {keys: [resolution_a, resolution_combined], expect: "2.16"}
  oracle:
    task_shaped:
      - {tool: get_structure, args: {pdb_id: 6LU7}}
    granular:
      - {tool: pdb_get_entry_info, args: {pdb_id: 6LU7}}

- id: mpro_6lu7_method
  question: What experimental method produced PDB entry 6LU7?
  grade: {keys: [method, experimental_method], expect: X-ray}
  oracle:
    task_shaped:
      - {tool: get_structure, args: {pdb_id: 6LU7}}
    granular:
      - {tool: pdb_get_entry_info, args: {pdb_id: 6LU7}}

- id: gefitinib_weight
  question: What is the molecular weight of gefitinib (CHEMBL939)?
  grade: {keys: [mol_weight, full_mwt], expect: "446.91"}
  oracle:
    task_shaped:
      - {tool: compare_compounds, args: {chembl_ids: [CHEMBL939]}}
    granular:
      - {tool: chembl_get_molecule, args: {molecule_chembl_id: CHEMBL939}}

- id: gefitinib_phase
  question: What is the maximum clinical phase reached by gefitinib?
  grade: {keys: [max_clinical_phase, max_phase], pattern: "4(\\.0)?"}
  oracle:
    task_shaped:
      - {tool: compare_compounds, args: {chembl_ids: [CHEMBL939]}}
    granular:
      - {tool: chembl_get_molecule, args: {molecule_chembl_id: CHEMBL939}}

- id: gefitinib_ro5
  question: How many Lipinski rule-of-five violations does gefitinib have?
  grade: {keys: [ro5_violations, num_ro5_violations], expect: "0"}
  oracle:
    task_shaped:
      - {tool: compare_compounds, args: {chembl_ids: [CHEMBL939]}}
    granular:
      - {tool: chembl_get_molecule, args: {molecule_chembl_id: CHEMBL939}}

