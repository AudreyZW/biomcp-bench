    task_shaped:
      - {tool: find_target, args: {query: "3C-like proteinase", organism_id: 2697049, limit: 1}}
    granular:
      - {tool: uniprot_search, args: {query: "\"3C-like proteinase\" AND organism_id:2697049", size: 1}}

- id: cross_db_egfr_pipeline
  question: For EGFR, give the best-resolved liganded structure and the most potent known inhibitor.
  grade: {keys: [compound, molecule_chembl_id], pattern: "CHEMBL[0-9]+"}
  oracle:
    task_shaped:
      - {tool: find_target, args: {query: EGFR, limit: 1}}
      - {tool: get_structures, args: {uniprot_accession: "$find:uniprot|primaryAccession", require_ligand: true, limit: 1}}
      - {tool: find_ligands, args: {target: "$find:chembl_target|target_chembl_id", limit: 1}}
    granular:
      - {tool: uniprot_search, args: {query: "EGFR AND organism_id:9606 AND reviewed:true", size: 1}}
      - {tool: pdb_search_combined, args: {attribute_a: "rcsb_polymer_entity_container_identifiers.reference_sequence_identifiers.database_accession", operator_a: exact_match, value_a: "$find:primaryAccession", attribute_b: "rcsb_entry_info.nonpolymer_entity_count", operator_b: greater, value_b: 0, rows: 1}}
      - {tool: pdb_get_entry_info, args: {pdb_id: "$find:identifier"}}
      - {tool: chembl_filter_targets_by_accession, args: {accession: P00533, limit: 1}}
      - {tool: chembl_filter_activities, args: {target_chembl_id: "$find:target_chembl_id", order_by: "-pchembl_value", limit: 1}}
