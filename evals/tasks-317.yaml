# FROZEN. The exact 317-task set the published live runs used.
#
# `evals/tasks.yaml` has since grown coverage tasks for tools that no
# oracle path exercised. Ground truth here was resolved at generation time
# and the archives have moved on, so regenerating would change answers the
# committed results were graded against. This file is what makes the live
# table in the README reproducible:
#
#   uv run python evals/run.py --mode ollama --variant all \
#     --tasks evals/tasks-317.yaml
#
# Generated by scripts/generate_tasks.py -- do not hand-edit.
#
# Every task here was validated by running both oracle paths, in shaped
# and raw form, and checking the grader could read the answer out. Ground
# truth comes from the archives, not from an author's memory.
#
# `$find:a|b` pulls a value from an earlier response, naming each alias it
# goes by: shaped responses say `uniprot`, raw ones say `primaryAccession`.
#
# 317 tasks.

- id: egfr_accession
  question: What is the UniProt accession for human EGFR?
  grade:
    keys:
    - uniprot
    - primaryAccession
    expect: P00533
    answer: P00533
  oracle:
    task_shaped:
    - tool: find_target
      args:
        query: EGFR
        limit: 1
    granular:
    - &id001
      tool: uniprot_search
      args:
        query: EGFR AND organism_id:9606 AND reviewed:true
        size: 5
- id: egfr_chembl_target
  question: Which ChEMBL target corresponds to human EGFR?
  grade:
    keys:
    - chembl_target
    - target_chembl_id
    pattern: CHEMBL[0-9]+
    answer: CHEMBL203
  oracle:
    task_shaped:
    - tool: find_target
      args:
        query: EGFR
        limit: 1
    granular:
    - *id001
    - &id002
      tool: chembl_filter_targets_by_accession
      args:
        accession: P00533
        limit: 1
- id: egfr_most_potent
  question: What is the ChEMBL ID of the most potent known EGFR inhibitor by pChEMBL
    value?
  grade:
    keys:
    - compound
    - molecule_chembl_id
    pattern: CHEMBL[0-9]+
    answer: CHEMBL4650319
  oracle:
    task_shaped:
    - tool: find_ligands
      args:
        target: P00533
        limit: 1
    granular:
    - *id002
    - tool: chembl_filter_activities
      args:
        target_chembl_id: $find:target_chembl_id
        order_by: -pchembl_value
        limit: 1
- id: egfr_most_potent_ic50
  question: What is the most potent EGFR inhibitor measured by IC50?
  grade:
    keys:
    - compound
    - molecule_chembl_id
    pattern: CHEMBL[0-9]+
    answer: CHEMBL176582
  oracle:
    task_shaped:
    - tool: find_ligands
      args:
        target: P00533
        assay_type: IC50
        limit: 1
    granular:
    - *id002
    - tool: chembl_filter_activities
      args:
        target_chembl_id: $find:target_chembl_id
        standard_type: IC50
        order_by: -pchembl_value
        limit: 1
- id: egfr_best_structure
  question: What is the PDB ID of the best-resolved EGFR structure with a bound ligand?
  grade:
    keys:
    - pdb_id
    - rcsb_id
    - identifier
    pattern: '[0-9A-Za-z]{4}'
    answer: 8A27
  oracle:
    task_shaped:
    - tool: get_structures
      args:
        uniprot_accession: P00533
        require_ligand: true
        limit: 1
    granular:
    - tool: pdb_search_combined
      args:
        attribute_a: rcsb_polymer_entity_container_identifiers.reference_sequence_identifiers.database_accession
        operator_a: exact_match
        value_a: P00533
        attribute_b: rcsb_entry_info.nonpolymer_entity_count
        operator_b: greater
        value_b: 0
        rows: 1
- id: egfr_structure_count
  question: How many PDB structures reference human EGFR?
  grade:
    keys:
    - structure_count
    - total_matches
    - total_count
    pattern: '[0-9]+'
    answer: 394
  oracle:
    task_shaped:
    - tool: get_structures
      args:
        uniprot_accession: P00533
        limit: 1
    granular:
    - tool: pdb_search_by_uniprot
      args:
        accession: P00533
        rows: 1
