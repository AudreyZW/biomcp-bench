name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch because astral-sh/setup-uv publishes no
      # floating major tag -- `@v10` does not resolve, and the first push to
      # a public remote failed on exactly that.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra evals

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The package ships py.typed, so its annotations are a promise to
      # anyone importing it. Two latent None paths were found here, not by a
      # failing test: a missing accession and a missing target id were each
      # passed to a client that annotates the parameter `str`, which builds a
      # request for the literal "None" and reads back as a true negative.
      - name: Type check
        run: uv run mypy

      # No network: the suite replays the committed response cache, and the
      # integration tests fail loudly rather than silently reaching upstream.
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term

      # The benchmark is part of the build. If its numbers move, the README is
      # out of date and that should be visible in a diff, not discovered later.
      - name: Benchmark (replay)
        run: uv run python evals/run.py --variant all
